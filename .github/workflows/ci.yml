name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check build script syntax
        run: bash -n scripts/build-app.sh scripts/build-dmg.sh
      - name: Build release executable
        run: swift build --configuration release
