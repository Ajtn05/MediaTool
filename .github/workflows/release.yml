name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must have the form v1.0.0." >&2
            exit 1
          fi
          echo "APP_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - name: Install icon renderer
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install imagemagick
      - name: Check build scripts
        run: bash -n scripts/build-app.sh scripts/build-dmg.sh
      - name: Build and verify universal DMG
        run: ./scripts/build-dmg.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="docs/releases/${RELEASE_TAG}.md"
          ASSETS=("dist/MediaTool-${APP_VERSION}-universal.dmg" "dist/MediaTool-${APP_VERSION}-universal.dmg.sha256")
          if [[ -f "$NOTES_FILE" ]]; then
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" --verify-tag \
              --title "MediaTool ${APP_VERSION}" --notes-file "$NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" --verify-tag \
              --title "MediaTool ${APP_VERSION}" --generate-notes
          fi
